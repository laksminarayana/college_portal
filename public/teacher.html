<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="brand">
            🎓 Teacher Portal
        </div>

        <nav>

            <button type="button" data-section="teacherHome">
                🏠 Dashboard
            </button>

            <button type="button" data-section="attendanceSection">
                📅 Attendance
            </button>

            <button type="button" data-section="marksSection">
                📊 Marks
            </button>

        </nav>

        <button
            class="logout"
            id="logoutButton"
            type="button"
        >
            Logout
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <h2>
                    Teacher Dashboard
                </h2>

                <p id="teacherWelcome"></p>

            </div>

        </header>


        <!-- HOME -->

        <section
            id="teacherHome"
            class="content-section"
        >

            <h2>Dashboard</h2>

            <div class="cards">

                <div class="info-card">

                    <span>Total Students</span>

                    <strong id="totalStudents">
                        0
                    </strong>

                </div>

                <div class="info-card">

                    <span>Total Subjects</span>

                    <strong id="totalSubjects">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- ATTENDANCE -->

        <section
            id="attendanceSection"
            class="content-section hidden"
        >

            <h2>Update Attendance</h2>

            <div class="form-card">

                <label>
                    Student
                </label>

                <select id="attendanceStudent">

                </select>


                <label>
                    Subject
                </label>

                <select id="attendanceSubject">

                </select>


                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="attendanceDate"
                    required
                >

                <label>
                    Status
                </label>

                <select id="attendanceStatus">
                    <option value="present">Present</option>
                    <option value="absent">Absent</option>
                    <option value="late">Late</option>
                </select>


                <button
                    id="saveAttendance"
                    type="button"
                >
                    Save Attendance
                </button>

                <p id="attendanceMessage"></p>

            </div>

        </section>


        <!-- MARKS -->

        <section
            id="marksSection"
            class="content-section hidden"
        >

            <h2>Update Marks</h2>

            <div class="form-card">

                <label>
                    Student
                </label>

                <select id="marksStudent">

                </select>


                <label>
                    Subject
                </label>

                <select id="marksSubject">

                </select>


                <label>
                    Exam
                </label>

                <select id="examType">

                    <option value="Mid 1">
                        Mid 1
                    </option>

                    <option value="Mid 2">
                        Mid 2
                    </option>

                </select>


                <label>
                    Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    min="0"
                    max="100"
                >


                <button
                    id="saveMarks"
                    type="button"
                >
                    Update Marks
                </button>

                <p id="marksMessage"></p>

            </div>

        </section>

    </main>

</div>

<script src="js/teacher.js"></script>

</body>

</html>
