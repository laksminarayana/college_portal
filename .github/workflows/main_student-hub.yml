
name: Build and deploy Student Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and test application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm test

      - name: Build React application
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            public/
            database/
            middleware/
            scripts/
            server.js
            database.js
            package.json
            package-lock.json
            node_modules/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      # Checks that GitHub can access all three secrets.
      # Secret values are never printed.
      - name: Verify Azure secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::AZURE_CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$TENANT_ID" ]; then
            echo "::error::AZURE_TENANT_ID is missing"
            exit 1
          fi

          if [ -z "$SUBSCRIPTION_ID" ]; then
            echo "::error::AZURE_SUBSCRIPTION_ID is missing"
            exit 1
          fi

          echo "All three Azure secrets are available."

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: student-hub
          slot-name: Production
          package: .
